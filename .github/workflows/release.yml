name: Build/Release LexisLocal

# Automatický podepsaný + notarizovaný release.
# Spustí se při pushnutí tagu v* (např. v1.1.3), při změně package.json na main,
# nebo ručně přes tlačítko „Run workflow".
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # nutné pro vytvoření GitHub Release přes GITHUB_TOKEN
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build & publish (macOS podepsaný+notarizovaný / Windows)
        shell: bash
        run: |
          git log -1 --pretty=%B > release-notes.txt
          if [ "$RUNNER_OS" == "Windows" ]; then
            npx electron-builder --win --publish always -c.releaseInfo.releaseNotesFile=release-notes.txt
          else
            npx electron-builder --mac --publish always -c.releaseInfo.releaseNotesFile=release-notes.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Podpis Developer ID (macOS) ---
          # .p12 v base64. Na Windows ZÁMĚRNĚ prázdné, aby se Apple certifikát
          # nepokusil použít na podpis Windows buildu.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          # --- Notarizace (electron-builder notarize:true → notarytool) ---
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
